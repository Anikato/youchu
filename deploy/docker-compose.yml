services:
  youchu:
    image: l97312/youchu:${YOUCHU_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${YOUCHU_HOST_PORT:-8080}:8080"
    env_file: .env
    environment:
      YOUCHU_HTTP_ADDR: 0.0.0.0:8080
      YOUCHU_DATA_DIR: /data
    volumes:
      - ./data:/data
    stop_grace_period: 10s
