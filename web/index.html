<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="moss">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>有处</title>
    <link rel="icon" type="image/svg+xml" href="/logo-yc.svg" />
    <script>
      (function () {
        var theme = localStorage.getItem("youchu-theme");
        var accent = localStorage.getItem("youchu-accent");
        if (theme !== "dark" && theme !== "light") theme = "dark";
        if (accent !== "moss" && accent !== "clay" && accent !== "ink") accent = "moss";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-accent", accent);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
