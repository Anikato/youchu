<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="moss">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161a18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="有处" />
    <title>有处</title>
    <link rel="icon" type="image/svg+xml" href="/logo-yc.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function () {
        var theme = localStorage.getItem("youchu-theme");
        var accent = localStorage.getItem("youchu-accent");
        if (theme !== "dark" && theme !== "light") theme = "dark";
        if (accent !== "moss" && accent !== "clay" && accent !== "ink") accent = "moss";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-accent", accent);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f3f6f4" : "#161a18");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
